<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academia Maravilhosas - Abdominais</title>
  <meta name="description" content="Guia rápido de abdominais por QR Code.">
  <link rel="stylesheet" href="css/style.css?v=2">
  <style>
    .videos-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:16px;
      margin-top:20px;
    }
    .exercise-card{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .exercise-card h3{
      margin:0;
    }
    .exercise-card p{
      margin:0;
    }
    .exercise-card .video-wrap{
      border-radius:16px;
      overflow:hidden;
    }
    .exercise-card video{
      width:100%;
      display:block;
      background:#000;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <img src="img/logo.png" class="logo" alt="Logo Maravilhosas">

      <div class="brand-info">
        <div class="academy-badge">Maravilhosas</div>
        <p>Escolha abaixo o abdominal que deseja assistir.</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero card fade-up fade-delay-1">
      <span class="tag">Treino Guiado</span>
      <h2>Abdominais</h2>
      <p class="subtitle">Role a página e escolha o exercício abdominal que deseja fazer.</p>
    </section>

    <section class="card fade-up fade-delay-2">
      <div class="section-head">
        <h3>Vídeos de Abdominais</h3>
        <p>Toque no vídeo para assistir.</p>
      </div>

      <div id="abdominaisList" class="videos-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <p>Em caso de dúvidas, procure um instrutor.</p>
  </footer>

  <script>
    const abdominais = [
      {
        titulo: "Abdominal Tradicional",
        subtitulo: "Movimento básico para reto abdominal",
        video: "videos/abdominal-tradicional.mp4"
      },
      {
        titulo: "Abdominal Infra",
        subtitulo: "Foco na parte inferior do abdômen",
        video: "videos/abdominal-infra.mp4"
      },
      {
        titulo: "Abdominal Oblíquo",
        subtitulo: "Foco na lateral do abdômen",
        video: "videos/abdominal-obliquo.mp4"
      },
      {
        titulo: "Prancha",
        subtitulo: "Estabilização e fortalecimento do core",
        video: "videos/prancha.mp4"
      },
      {
        titulo: "Abdominal Bicicleta",
        subtitulo: "Trabalho combinado de core e oblíquos",
        video: "videos/abdominal-bicicleta.mp4"
      },
      {
        titulo: "Elevação de Pernas",
        subtitulo: "Foco em core e abdômen inferior",
        video: "videos/elevacao-de-pernas.mp4"
      }
    ];

    const container = document.getElementById("abdominaisList");

    container.innerHTML = abdominais.map(item => `
      <article class="card exercise-card">
        <div>
          <h3>${item.titulo}</h3>
          <p class="subtitle">${item.subtitulo}</p>
        </div>

        <div class="video-wrap">
          <video controls playsinline preload="metadata" poster="img/poster-padrao.png">
            <source src="${item.video}" type="video/mp4">
            Seu navegador não suporta vídeo.
          </video>
        </div>
      </article>
    `).join("");
  </script>
</body>
</html>
